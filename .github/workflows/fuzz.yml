name: Scheduled bounded wallet fuzz campaign
on:
  schedule:
    - cron: '0 3 * * 2,5'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: wallet-long-fuzz
  cancel-in-progress: false
jobs:
  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.3
          cache: false
      - run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev libseccomp2
      - name: Longer local campaigns; Decred deferred by owner
        run: make test-fuzz-long FUZZ_SECONDS=300
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: wallet-long-fuzz-evidence
          path: reports/fuzz-long*
