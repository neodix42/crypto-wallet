name: Nightly24-hour deterministic wallet soak
on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: wallet-soak
  cancel-in-progress: false
jobs:
  soak:
    # A24-hour job needs a dedicated runner. No real funds or user vaults.
    runs-on: [self-hosted, linux, x64, wallet-soak]
    timeout-minutes: 1500
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run complete deterministic workload
        run: make test-soak
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: wallet24-hour-soak-evidence
          path: reports/soak.json
