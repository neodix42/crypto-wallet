name: Build and publish wallet
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: wallet-release
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      artifact-id: ${{ steps.payload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.3
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install compilation prerequisites
        run: sudo apt-get update && sudo apt-get install -y build-essential libseccomp2
      - name: Choose the next version
        id: version
        run: |
          version=$(python3 scripts/next-version.py)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "WALLET_VERSION=$version" >> "$GITHUB_ENV"
      - name: Build the versioned portable desktop once
        run: make package-desktop
      - name: Verify candidate version and packaged production security
        run: |
          ./scripts/with-toolchain.sh python3 scripts/verify-version.py
          ./scripts/with-toolchain.sh node scripts/verify-artifact.cjs
      - name: Prepare portable release and private verification records
        env:
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_REPOSITORY_ID: ${{ github.repository_id }}
          RELEASE_SOURCE_REF: ${{ github.ref }}
        run: |
          python3 - <<'PY'
          import json,os,pathlib
          v=os.environ['WALLET_VERSION']
          repo=os.environ['RELEASE_REPOSITORY']
          commit=os.environ['GITHUB_SHA']
          checks=f'https://github.com/{repo}/commit/{commit}/checks'
          pathlib.Path('reports').mkdir(exist_ok=True)
          pathlib.Path('reports/release-build.json').write_text(json.dumps({
            'version':v,'sourceCommit':commit,'status':'BUILD_ONLY',
            'tests':'NOT_RUN: independent .github/workflows/ci.yml workflow',
            'checksURL':checks,'productionReadiness':'NOT_RUN'
          },indent=2)+'\n')
          run=f'https://github.com/{repo}/actions/runs/{os.environ["GITHUB_RUN_ID"]}'
          pathlib.Path('dist/RELEASE-NOTES.md').write_text(f'''CryptoWallet {v} — development release; mainnet profile by default.

          Download cryptowallet-{v}-linux-amd64.tar.gz, extract it, then run CryptoWallet-linux-x64/cryptowallet as an ordinary user. Keep the extracted runtime intact. Required third-party license texts are included inside the archive. No Debian installer is built.

          The tag, release name, Electron application and Go executable versions are all {v}.
          Tests were NOT_RUN in this build workflow; they run independently in ci.yml. Check this exact source commit's results: {checks}
          Reports retained under docs/evidence are historical and do not certify this candidate.

          Publisher authentication is verified before publication. Detached verification records (RELEASE-SHA256SUMS, release-provenance.sigstore.json, release.json and RELEASE-NOTES.md) are in the wallet-release-verification-{v} Actions artifact for this run: {run}
          Download and retain those records within 90 days (or earlier repository cleanup), alongside the portable archive, if you need independent/offline verification later. See docs/BUILD.md in a separately trusted source checkout. These records are not runtime dependencies.

          Public funded testnet roundtrips, the full installed X11/Wayland OS matrix, 24-hour soak and independent security review remain separate production gates. Mainnet spending is never automated. Local make install remains unsigned and needs no publishing identity.
          ''')
          PY
          python3 scripts/release_assets.py prepare --version "$WALLET_VERSION" --repo "$RELEASE_REPOSITORY" --repo-id "$RELEASE_REPOSITORY_ID" --ref "$RELEASE_SOURCE_REF" --commit "$GITHUB_SHA"
      - name: Hand off the built release payload without recompression
        id: payload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wallet-release-payload
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
          path: |
            dist/cryptowallet-${{ steps.version.outputs.version }}-linux-amd64.tar.gz
            dist/RELEASE-NOTES.md
            dist/release.json
            dist/RELEASE-SHA256SUMS

  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
    env:
      WALLET_VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download only this build job's immutable artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          merge-multiple: true
          digest-mismatch: error
          path: dist
      - name: Verify the transferred payload before authentication
        env:
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_REPOSITORY_ID: ${{ github.repository_id }}
          RELEASE_SOURCE_REF: ${{ github.ref }}
        run: python3 scripts/release_assets.py check --version "$WALLET_VERSION" --repo "$RELEASE_REPOSITORY" --repo-id "$RELEASE_REPOSITORY_ID" --ref "$RELEASE_SOURCE_REF" --commit "$GITHUB_SHA"
      - name: Provision pinned release authentication tool
        run: python3 scripts/bootstrap-gh.py >> "$GITHUB_PATH"
      - name: Set up the pinned signing runtime
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: .github/provenance/package-lock.json
      - name: Install locked signing dependencies without lifecycle scripts
        run: npm --prefix .github/provenance ci --ignore-scripts --no-audit --no-fund
      - name: Authenticate the complete release checksum manifest
        timeout-minutes: 3
        run: node .github/provenance/attest.mjs
      - name: Verify publisher provenance before any publication
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_REPOSITORY_ID: ${{ github.repository_id }}
          RELEASE_SOURCE_REF: ${{ github.ref }}
        run: |
          python3 scripts/release_assets.py verify --version "$WALLET_VERSION" --repo "$RELEASE_REPOSITORY" --repo-id "$RELEASE_REPOSITORY_ID" --ref "$RELEASE_SOURCE_REF" --commit "$GITHUB_SHA"
      - name: Retain detached verification records outside the release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wallet-release-verification-${{ needs.build.outputs.version }}
          if-no-files-found: error
          retention-days: 90
          path: |
            dist/RELEASE-SHA256SUMS
            dist/release-provenance.sigstore.json
            dist/release.json
            dist/RELEASE-NOTES.md
      - name: Publish only the portable wallet with matching version, tag and name
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        run: |
          gh release create "$RELEASE_VERSION" --target "$GITHUB_SHA" --title "$RELEASE_VERSION" --notes-file dist/RELEASE-NOTES.md \
            "dist/cryptowallet-$RELEASE_VERSION-linux-amd64.tar.gz"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: wallet-release-failure-payload
          path: |
            reports/
            dist/
            !dist/CryptoWallet-linux-x64/
