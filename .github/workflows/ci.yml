name: hermetic-security-gates
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.27.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
      - run: sudo apt-get update && sudo apt-get install -y build-essential libgtk-3-0t64 libseccomp2 libxtst6 xvfb python3-pil tesseract-ocr
      - run: npm --prefix desktop ci --ignore-scripts
      - run: ./scripts/with-toolchain.sh python3 scripts/provision-tests.py
      - run: make test test-security test-race test-interop test-integration test-fuzz coverage
      - run: make check-deps
      - name: Restore all wallets in independent fresh application copies
        run: make test-recovery
      - name: Check native phrase setup and recovery through the production desktop
        run: make test-packaged
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence
          path: reports/
