name: Wallet tests
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: wallet-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  native-wallet:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.3
      - name: Install native build and isolated desktop test prerequisites
        run: sudo apt-get update && sudo apt-get install -y build-essential libgtk-3-0t64 libxtst6 xvfb python3-pil python3-tk tesseract-ocr iproute2 util-linux ca-certificates dbus
      - name: Build and verify the one-file archive with Node and Electron forbidden
        run: python3 scripts/go-build-test.py
      - name: Exercise native controller and GTK private dialogs
        run: |
          ./scripts/with-go.sh go test -race ./internal/nativewallet ./internal/sessionwatch
          python3 internal/nativeui/test-x11.py
      - name: Restore all wallets using only independent copies of cryptowallet
        run: make test-recovery-portable
      - name: Exercise the actual native application on a private display
        run: ./scripts/with-go.sh python3 scripts/native-wallet-test.py
      - name: Provision the pinned real private-chain node before network isolation
        run: docker pull ethereum/client-go:v1.17.9@sha256:1ae3571b074ccda207808fd228ade023f62ebdeb1dab6b393093dcc8b5293109
      - name: Execute Go-approved funds only on an isolated actual geth chain
        run: make test-send-portable
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: native-wallet-evidence
          path: |
            reports/native-*.json
            reports/portable-*.json
            reports/go-only-build.json
            dist/portable-build-verification.json
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.19.0
      - run: sudo apt-get update && sudo apt-get install -y build-essential libgtk-3-0t64 libseccomp2 libxtst6 xvfb python3-pil python3-tk tesseract-ocr iproute2 util-linux apparmor-utils
      - run: npm --prefix desktop ci --ignore-scripts
      - run: npm --prefix .github/provenance ci --ignore-scripts
      - name: Provision pinned offline provenance verifier
        run: python3 scripts/bootstrap-gh.py >> "$GITHUB_PATH"
      - run: ./scripts/with-toolchain.sh python3 scripts/provision-tests.py
      - run: make test test-security test-race test-interop test-integration test-fuzz coverage
      - name: Execute Go-signed USDT transfers on isolated pinned EVM
        run: WALLET_USDT_EVM=1 ./scripts/with-toolchain.sh go test ./internal/chains/evm -run USDT -count=1
      - run: make check-deps
      - name: Restore all wallets in independent fresh application copies
        run: make test-recovery
      - name: Check owned-process crash recovery and secret canaries
        run: make test-crash
      - name: Permit sandboxed desktop checks in an ephemeral CI AppArmor profile
        run: python3 scripts/ci-desktop.py setup
      - name: Retain legacy Electron phrase setup and recovery regression
        run: python3 scripts/ci-desktop.py run -- make test-packaged-desktop
      - name: Retain legacy Electron-approved payment on an isolated actual geth chain
        run: python3 scripts/ci-desktop.py run -- ./scripts/with-toolchain.sh python3 scripts/packaged-send.py
      - name: Remove the ephemeral CI desktop AppArmor profile
        if: always()
        run: python3 scripts/ci-desktop.py cleanup
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: evidence
          path: reports/
