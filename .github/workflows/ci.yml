name: Wallet tests
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: wallet-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  wails-wallet:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify tracked build inputs before dependency caching
        run: python3 scripts/check-build-inputs.py
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.3
      - name: Set up pinned frontend compiler
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: internal/webui/frontend/package-lock.json
      - name: Install native build and isolated desktop test prerequisites
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev libxtst6 xvfb python3-pil python3-tk tesseract-ocr iproute2 util-linux apparmor-utils ca-certificates dbus
      - name: Build embedded React UI and verify the one-file Go archive
        run: python3 scripts/go-build-test.py
      - name: Exercise controller, Wails bridge and frontend security regressions
        run: |
          ./scripts/with-go.sh go test -race ./internal/nativewallet ./internal/sessionwatch ./internal/webui
          ./scripts/with-toolchain.sh npm --prefix internal/webui/frontend test
      - name: Exercise NEAR staking authorization and semantic security mutants
        run: make test-near-staking
      - name: Restore all wallets using only independent copies of cryptowallet
        run: make test-recovery-portable
      - name: Verify the pinned Wails fork and actual ephemeral WebKit restrictions
        run: make test-wails-security
      - name: Permit owned test namespaces in an ephemeral CI-only profile
        run: python3 scripts/ci-desktop.py setup
      - name: Exercise the actual Wails application on a private display
        run: python3 scripts/ci-desktop.py run -- make test-wails-wallet
      - name: Exercise actual executable installation in disposable directories
        run: ./scripts/with-go.sh python3 scripts/portable-install-test.py
      - name: Provision the pinned real private-chain node before network isolation
        run: docker pull ethereum/client-go:v1.17.9@sha256:1ae3571b074ccda207808fd228ade023f62ebdeb1dab6b393093dcc8b5293109
      - name: Execute Go-approved funds only on an isolated actual geth chain
        run: python3 scripts/ci-desktop.py run -- make test-send-portable
      - name: Remove the ephemeral CI-only test profile
        if: always()
        run: python3 scripts/ci-desktop.py cleanup
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: wails-wallet-evidence
          path: |
            reports/native-*.json
            reports/wails-*.json
            reports/wails-*-near-public-contract.png
            reports/portable-*.json
            reports/go-only-build.json
            dist/portable-build-verification.json
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify tracked build inputs before compiler setup
        run: python3 scripts/check-build-inputs.py
      - name: Exercise missing and untracked build-input regressions
        run: python3 scripts/check-build-inputs-test.py
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.19.0
      - run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev libseccomp2 libxtst6 xvfb python3-pil python3-tk tesseract-ocr iproute2 util-linux apparmor-utils
      - run: npm --prefix .github/provenance ci --ignore-scripts
      - name: Provision pinned offline provenance verifier
        run: python3 scripts/bootstrap-gh.py >> "$GITHUB_PATH"
      - run: ./scripts/with-toolchain.sh python3 scripts/provision-tests.py
      - name: Exercise unit, frontend and developer-tool regressions
        run: make test-ci
      - name: Exercise security boundaries and semantic mutants
        run: make test-security-ci
      - name: Detect Go data races
        run: make test-race-ci
      - name: Compare independent interoperability fixtures
        run: make test-interop
      - name: Exercise actual local chain integrations
        run: make test-integration
      - name: Exercise bounded fuzz campaigns
        run: make test-fuzz
      - name: Execute Go-signed USDT transfers on isolated pinned EVM
        run: WALLET_USDT_EVM=1 ./scripts/with-toolchain.sh go test ./internal/chains/evm -run USDT -count=1
      - run: make check-deps-ci
      - name: Restore all wallets in independent fresh application copies
        run: make test-recovery
      - name: Check owned-process crash recovery and secret canaries
        run: make test-crash
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: evidence
          path: reports/
