<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
<include ignore_missing="no">/etc/fonts/fonts.conf</include>
<match target="pattern"><test name="family" qual="any" compare="eq"><string>sans-serif</string></test><edit name="family" mode="prepend" binding="strong"><string>DejaVu Sans</string></edit></match>
<match target="pattern"><test name="family" qual="any" compare="eq"><string>system-ui</string></test><edit name="family" mode="prepend" binding="strong"><string>DejaVu Sans</string></edit></match>
<match target="pattern"><test name="family" qual="any" compare="eq"><string>Arial</string></test><edit name="family" mode="prepend" binding="strong"><string>DejaVu Sans</string></edit></match>
<match target="pattern"><test name="family" qual="any" compare="eq"><string>Helvetica</string></test><edit name="family" mode="prepend" binding="strong"><string>DejaVu Sans</string></edit></match>
<match target="pattern"><test name="family" qual="any" compare="eq"><string>ui-monospace</string></test><edit name="family" mode="prepend" binding="strong"><string>DejaVu Sans Mono</string></edit></match>
<match target="pattern"><test name="family" qual="any" compare="eq"><string>SFMono-Regular</string></test><edit name="family" mode="prepend" binding="strong"><string>DejaVu Sans Mono</string></edit></match>
<match target="pattern"><test name="family" qual="any" compare="eq"><string>Consolas</string></test><edit name="family" mode="prepend" binding="strong"><string>DejaVu Sans Mono</string></edit></match>
<match target="pattern"><test name="family" qual="any" compare="eq"><string>monospace</string></test><edit name="family" mode="prepend" binding="strong"><string>DejaVu Sans Mono</string></edit></match>
</fontconfig>
